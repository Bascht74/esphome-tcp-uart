name: ESPHome

on:
  push:
  pull_request:

jobs:
  config:
    name: Config against ESPHome 2026.9.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install "esphome==2026.9.0"
      - name: Validate configs
        run: ./script/ci

  compile:
    name: Compile against ESPHome 2026.9.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install "esphome==2026.9.0"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache
            ~/.espressif
          key: esphome-2026.9.0-${{ runner.os }}
      - name: Compile
        run: esphome compile tests/compile.yaml
