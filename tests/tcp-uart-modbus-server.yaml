esphome:
  name: tcp-uart-modbus-server
  min_version: 2026.9.0

esp32:
  board: esp32dev

wifi:
  ssid: "test-ssid"
  password: "test-password"

logger:

external_components:
  - source:
      type: local
      path: ../components

tcp_uart:
  - id: modbus_link
    role: server
    port: 502
    protocol: modbus

modbus:
  - id: server_bus
    uart_id: modbus_link
    role: server
