esphome:
  name: modbus-tcp-uart-alias
  min_version: 2026.9.0

esp32:
  board: esp32dev

wifi:
  ssid: "test-ssid"
  password: "test-password"

logger:

external_components:
  - source:
      type: local
      path: ../components

modbus_tcp_uart:
  - id: meter_link
    host: 192.0.2.10
    port: 502

modbus:
  - id: meter_bus
    uart_id: meter_link
    role: client

modbus_controller:
  - id: meter
    modbus_id: meter_bus
    address: 1
    update_interval: 5s

sensor:
  - platform: modbus_controller
    modbus_controller_id: meter
    name: "Alias register"
    address: 1
    register_type: read
    value_type: U_WORD
