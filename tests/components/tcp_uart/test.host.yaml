esphome:
  name: host-tcp-uart
  min_version: 2026.9.0

host:

logger:
  level: INFO

external_components:
  - source:
      type: local
      path: ../../../components

tcp_uart:
  - id: tcp_uart_1
    host: 127.0.0.1
    port: 44502
    protocol: raw
    reconnect_interval: 1s
    address:
      name: Remote address

interval:
  - interval: 60s
    then:
      - lambda: |-
          uint8_t byte;
          if (id(tcp_uart_1).available() && id(tcp_uart_1).read_byte(&byte)) {
            id(tcp_uart_1).write_byte(byte);
          }
