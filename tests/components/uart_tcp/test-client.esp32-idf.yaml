packages:
  device: !include ../../bases/esp32-idf.yaml
  uart: !include ../../buses/uart/esp32-idf.yaml

external_components:
  - source:
      type: local
      path: ../../../components

wifi:
  ssid: MySSID
  password: password1

uart_tcp:
  - id: uart_tcp_client_1
    uart_id: uart_bus
    role: client
    host: 192.0.2.20
    port: 502
    reconnect_interval: 5s
    connected:
      name: UART TCP Connected
    address:
      name: UART TCP Address

interval:
  - interval: 60s
    then:
      - uart.write:
          id: uart_bus
          data: [0x00, 0x20, 0x42]
