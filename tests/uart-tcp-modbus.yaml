esphome:
  name: uart-tcp-modbus
  min_version: 2026.9.0

esp32:
  board: esp32dev

wifi:
  ssid: "test-ssid"
  password: "test-password"

logger:

external_components:
  - source:
      type: local
      path: ../components

uart:
  - id: bus
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1

uart_tcp:
  - id: gateway
    uart_id: bus
    role: server
    port: 502
    protocol: modbus
  - id: raw_client
    uart_id: bus
    role: client
    host: 192.0.2.30
    port: 5000
    protocol: raw
    address:
      name: Remote address
